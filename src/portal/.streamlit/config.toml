[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#EDF1F4"
textColor = "#1E293B"
linkColor = "#0F766E"
borderColor = "#DCE3EA"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.5rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["1.9rem", "1.35rem", "1.1rem", "1rem", "0.9rem", "0.85rem"]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeBorderColor = "#E2E8F0"
greenColor = "#15803D"
orangeColor = "#C2410C"
redColor = "#B91C1C"
blueColor = "#1D4ED8"
chartCategoricalColors = ["#0F766E", "#2563EB", "#D97706", "#7C3AED", "#DC2626", "#64748B", "#059669"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"

[client]
toolbarMode = "minimal"
